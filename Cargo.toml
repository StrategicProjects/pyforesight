[package]
name = "pyforesight"
version = "0.1.0"
edition = "2021"
description = "Python bindings of the foresight forecasting crate"
license = "MIT"
repository = "https://github.com/StrategicProjects/pyforesight"
publish = false

[lib]
name = "_foresight"
crate-type = ["cdylib"]

[dependencies]
foresight = "=0.7.1"
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[profile.release]
lto = "fat"
codegen-units = 1
