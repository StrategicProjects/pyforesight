[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyforesight"
description = "Time series forecasting that picks its model by what would have worked: rolling-origin backtests, empirical intervals, ARIMA, ETS, Prophet, TBATS, STL and ensembles, in Rust."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "André Leite", email = "leite@castlab.org" },
  { name = "Marcos Wasiliew", email = "marcos.wasiliew@gmail.com" },
  { name = "Hugo Vasconcelos", email = "hugo.vasconcelos@ufpe.br" },
  { name = "Carlos Amorim", email = "carlos.agaf@ufpe.br" },
  { name = "Diogo Bezerra", email = "diogo.bezerra@ufpe.br" },
  { name = "Júlia Nascimento Barreto", email = "juliabarreto@gd.seplag.pe.gov.br" },
]
maintainers = [{ name = "André Leite", email = "leite@castlab.org" }]
keywords = ["forecasting", "time series", "arima", "ets", "prophet", "backtest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://strategicprojects.github.io/pyforesight/"
Source = "https://github.com/StrategicProjects/pyforesight"
Issues = "https://github.com/StrategicProjects/pyforesight/issues"
"Rust crate" = "https://crates.io/crates/foresight"

[tool.maturin]
python-source = "python"
module-name = "foresight._foresight"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: TBATS and the thorough backtest (seconds each); skip with -m 'not slow'"]
