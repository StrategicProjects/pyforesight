name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        run: pip install ".[test,pandas]" numpy
      - name: Test
        run: pytest -v
      - name: Type stubs match the module
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          pip install mypy
          python -m mypy.stubtest foresight._foresight --ignore-disjoint-bases --allowlist stubtest-allowlist.txt
